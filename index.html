<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>M3U8播放器（支持Excel导入剧集）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            padding: 12px;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        .control-wrap {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
        }
        #m3u8-url {
            flex: 1; min-width: 220px; padding: 12px;
            background: #1a1a1a; border: 1px solid #444;
            color: #fff; border-radius: 6px; font-size: 16px;
        }
        button {
            padding: 12px 16px; cursor: pointer; border: none;
            border-radius: 6px; background: #3366cc; color: #fff; font-size: 15px;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        button:active { opacity: 0.8; }

        /* ===== 响应式视频容器：padding-bottom 宽高比方案，兼容性优于 aspect-ratio ===== */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 46.25%; /* 16:9 */
            background: #111;
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }
        /* 横屏手机全屏时视频铺满 */
        .video-container video.fullscreen-active {
            object-fit: contain;
        }

        .tips { color: #999; font-size: 13px; margin-top: 8px; line-height: 1.5; }
        .progress {
            height: 10px; width: 100%; background-color: #1a1a1a;
            border-radius: 4px; margin: 10px 0; display: none;
        }
        .progress-bar {
            height: 100%; width: 0%; background-color: #00ff9d;
            border-radius: 4px; transition: width 0.3s;
        }
        .status { margin-top: 10px; color: #00ff9d; font-size: 14px; word-break: break-all; }
        .episode-upload {
            margin: 20px 0; padding: 15px; background: #222; border-radius: 8px;
        }
        .episode-upload h3 { margin-bottom: 12px; font-size: 18px; }
        .episode-list { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 8px; }
        .episode-btn {
            padding: 10px 14px; background: #333; border: 1px solid #555;
            color: #fff; border-radius: 4px; cursor: pointer;
            transition: all 0.2s; font-size: 15px; min-width: 44px;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .episode-btn:hover { background: #0099ff; border-color: #0099ff; }
        .episode-btn.active { background: #00ff9d; border-color: #00ff9d; color: #000; }
        .excel-tips { color: #999; font-size: 12px; margin-top: 8px; line-height: 1.5; }

        /* 全屏按钮 */
        .fs-btn {
            position: absolute; bottom: 8px; right: 8px; z-index: 10;
            background: rgba(0,0,0,0.6); border-radius: 4px;
            padding: 6px 10px; font-size: 18px; line-height: 1;
            border: none; color: #fff; cursor: pointer;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 480px) {
            body { padding: 8px; }
            button { padding: 10px 12px; font-size: 14px; }
            .episode-upload { padding: 12px; }
            .control-wrap { gap: 8px; }
        }
    </style>
    <!-- 播放依赖：使用 @1 语义化版本锁定 v1 系列最新稳定版 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <!-- 备用 CDN 兜底 -->
    <script>
        if (typeof Hls === 'undefined') {
            document.write('<script src="https://unpkg.com/hls.js@1/dist/hls.min.js"><\/script>');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/m3u8-parser@latest/dist/m3u8-parser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="control-wrap">
        <input type="text" id="m3u8-url" value="" placeholder="粘贴M3U8链接">
        <button onclick="playVideo()">播放</button>
        <button onclick="downloadVideo()">下载TS分片</button>
        <button onclick="clearUrl()">清除</button>
    </div>

    <!-- 响应式视频容器 -->
    <div class="video-container" id="videoContainer">
        <video id="video-player" controls playsinline webkit-playsinline preload="metadata"></video>
        <button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()">⛶</button>
    </div>

    <div class="progress" id="progressBar">
        <div class="progress-bar" id="progressInner"></div>
    </div>
    <div class="status" id="statusText"></div>

    <div class="episode-upload">
        <h3>剧集导入</h3>
        <input type="file" id="excelFile" accept=".xlsx,.xls" onchange="parseExcel(this)">
        <div class="episode-list" id="episodeList"></div>
        <div class="excel-tips">
            提示：Excel文件要求：第一列为剧集序号（1、2、3...），第二列为对应M3U8链接；支持.xlsx/.xls格式，仅解析第一个工作表
        </div>
    </div>

    <div class="tips">
        ⚠️提示：下载TS分片功能仅支持电脑端Chrome/Edge；手机浏览器不支持文件夹写入API。
    </div>

    <script>
        let video = document.getElementById('video-player');
        let hls = null;
        let currentM3U8Url = '';
        const progressBar = document.getElementById('progressBar');
        const progressInner = document.getElementById('progressInner');
        const statusText = document.getElementById('statusText');
        const urlInput = document.getElementById('m3u8-url');
        const episodeList = document.getElementById('episodeList');
        const videoContainer = document.getElementById('videoContainer');
        const fsBtn = document.getElementById('fsBtn');
        let episodeMap = new Map();

        // ===== 检测设备类型，动态返回最优 HLS 配置 =====
        function getHlsConfig() {
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            const baseConfig = {
                enableWorker: true,          // Web Worker 异步解析，减少主线程卡顿
                capLevelToPlayerSize: true,  // 限制质量不超过播放器尺寸，节省带宽
                maxBufferHole: 0.5,          // 允许的缓冲空洞
            };
            if (isMobile) {
                // 移动端：内存敏感，缓冲区收紧，超时缩短
                return Object.assign(baseConfig, {
                    maxBufferLength: 15,
                    maxMaxBufferLength: 30,
                    maxBufferSize: 30 * 1000 * 1000, // 30MB
                    backBufferLength: 15,
                    manifestLoadingTimeOut: 5000,
                    levelLoadingTimeOut: 5000,
                    fragLoadingTimeOut: 8000,
                    startLevel: 0,  // 移动端从最低画质开始，快速出画
                });
            } else {
                // 桌面端：稳定网络，缓冲可放宽
                return Object.assign(baseConfig, {
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    maxBufferSize: 80 * 1000 * 1000, // 80MB
                    backBufferLength: 30,
                });
            }
        }

        function playVideo(playUrl) {
            const url = playUrl || urlInput.value.trim();
            if (!url) { alert('请输入M3U8链接！'); return; }
            urlInput.value = url;
            currentM3U8Url = url;

            // 销毁旧实例
            if (hls) { hls.destroy(); hls = null; }
            video.removeAttribute('src');
            video.load();

            // iOS 上防止 AirPlay 劫持缓冲区
            video.disableRemotePlayback = true;

            // 非 Safari 浏览器使用 hls.js
            if (Hls.isSupported()) {
                hls = new Hls(getHlsConfig());
                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => {
                        console.log('自动播放被阻止，用户手动点击即可：', err);
                    });
                });

                // ===== 错误自动恢复：而非直接 alert 中断播放 =====
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (!data.fatal) return;
                    console.warn('HLS fatal error:', data.type, data.details);
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            // 网络错误：重新加载
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            // 媒体错误：尝试恢复
                            hls.recoverMediaError();
                            break;
                        default:
                            // 无法恢复，销毁并提示
                            hls.destroy();
                            hls = null;
                            alert('播放失败：' + data.error.message);
                            break;
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari 原生 HLS 支持
                video.src = url;
                video.load();
                video.play().catch(e => console.log(e));
            } else {
                alert('当前浏览器不支持HLS播放');
            }
            updateEpisodeActiveStatus(url);
        }

        // ===== 全屏切换 =====
        function toggleFullscreen() {
            const el = videoContainer;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.webkitEnterFullscreen && video.webkitEnterFullscreen) {
                    // iOS Safari 回退到 video 原生全屏
                    video.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        // 监听全屏变化，切换按钮图标
        document.addEventListener('fullscreenchange', () => {
            fsBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
        });
        document.addEventListener('webkitfullscreenchange', () => {
            fsBtn.textContent = document.webkitFullscreenElement ? '✕' : '⛶';
        });

        // ===== 下载TS分片 =====
        async function downloadVideo() {
            const url = currentM3U8Url || urlInput.value.trim();
            if (!url) { alert('请先输入并播放M3U8链接！'); return; }
            if (!('showDirectoryPicker' in window)) {
                alert('⚠️当前浏览器不支持文件夹下载，该功能仅电脑Chrome/Edge可用，手机浏览器不支持！');
                return;
            }
            progressBar.style.display = 'block';
            progressInner.style.width = '0%';
            statusText.textContent = '正在解析M3U8文件...';
            try {
                const m3u8Response = await fetch(url);
                if (!m3u8Response.ok) throw new Error('M3U8文件获取失败');
                const m3u8Text = await m3u8Response.text();
                const parser = new m3u8Parser.Parser();
                parser.push(m3u8Text);
                parser.end();
                const segments = parser.manifest.segments;
                if (!segments || segments.length === 0) throw new Error('未找到TS分片');
                const tsUrls = segments.map(seg => new URL(seg.uri, url).href);
                const total = tsUrls.length;

                statusText.textContent = '请选择保存位置...';
                const rootDir = await window.showDirectoryPicker({ mode: 'readwrite' });

                const now = new Date();
                const dateStr =
                    now.getFullYear() +
                    String(now.getMonth()+1).padStart(2,'0') +
                    String(now.getDate()).padStart(2,'0') + '_' +
                    String(now.getHours()).padStart(2,'0') +
                    String(now.getMinutes()).padStart(2,'0') +
                    String(now.getSeconds()).padStart(2,'0');
                const folderName = `m3u8_ts_${dateStr}`;
                const targetDir = await rootDir.getDirectoryHandle(folderName, { create: true });

                let downloaded = 0;
                statusText.textContent = `开始下载 ${total} 个TS分片到文件夹 "${folderName}" ...`;
                for (let i = 0; i < tsUrls.length; i++) {
                    const response = await fetch(tsUrls[i]);
                    if (!response.ok) throw new Error(`分片 ${i+1} 下载失败`);
                    const blob = await response.blob();
                    const fileName = `segment_${String(i+1).padStart(4, '0')}.ts`;
                    const fileHandle = await targetDir.getFileHandle(fileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    downloaded++;
                    const progress = Math.floor((downloaded / total) * 100);
                    progressInner.style.width = `${progress}%`;
                    statusText.textContent = `已下载 ${downloaded}/${total} 个分片 (${fileName})`;
                }
                progressInner.style.width = '100%';
                statusText.textContent = `全部 ${total} 个分片已保存到文件夹：${folderName}`;
            } catch (error) {
                if (error.name === 'AbortError' || error.message.includes('abort')) {
                    statusText.textContent = '用户取消了文件夹选择';
                } else {
                    statusText.textContent = `下载失败: ${error.message}`;
                    console.error('下载失败：', error);
                }
            } finally {
                setTimeout(() => { progressBar.style.display = 'none'; }, 5000);
            }
        }

        function clearUrl() {
            urlInput.value = '';
            currentM3U8Url = '';
            if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (hls) { hls.destroy(); hls = null; }
            progressBar.style.display = 'none';
            progressInner.style.width = '0%';
            statusText.textContent = '';
            episodeList.innerHTML = '';
            episodeMap.clear();
            alert('已成功清除M3U8地址并停止播放！');
        }

        function parseExcel(fileInput) {
            const file = fileInput.files[0];
            if (!file) return;
            const fileExt = file.name.split('.').pop().toLowerCase();
            if (!['xlsx', 'xls'].includes(fileExt)) {
                alert('请上传.xlsx或.xls格式的Excel文件！');
                fileInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: ['episode', 'url'] });
                    const validData = jsonData.filter(item => {
                        return item.episode && item.url &&
                               !isNaN(Number(item.episode)) &&
                               item.url.trim().startsWith('http');
                    });
                    if (validData.length === 0) {
                        alert('Excel中未找到有效的剧集数据！请检查格式：第一列是数字序号，第二列是M3U8链接');
                        return;
                    }
                    validData.sort((a, b) => Number(a.episode) - Number(b.episode));
                    episodeList.innerHTML = '';
                    episodeMap.clear();
                    validData.forEach(item => {
                        const episodeNum = Number(item.episode);
                        const m3u8Url = item.url.trim();
                        episodeMap.set(episodeNum, m3u8Url);
                        const btn = document.createElement('button');
                        btn.className = 'episode-btn';
                        btn.innerText = episodeNum;
                        btn.onclick = function() { playVideo(m3u8Url); };
                        episodeList.appendChild(btn);
                    });
                    alert(`成功导入 ${validData.length} 集剧集链接！`);
                } catch (error) {
                    console.error('解析Excel失败：', error);
                    alert('Excel解析失败，请检查文件格式或内容是否正确！');
                } finally {
                    fileInput.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function updateEpisodeActiveStatus(currentUrl) {
            const allBtns = document.querySelectorAll('.episode-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));
            for (const [num, url] of episodeMap.entries()) {
                if (url === currentUrl) {
                    const targetBtn = Array.from(allBtns).find(btn => btn.innerText == num);
                    if (targetBtn) targetBtn.classList.add('active');
                    break;
                }
            }
        }
    </script>
</body>
</html>
